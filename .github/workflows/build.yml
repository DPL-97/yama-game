name: Build Desktop Executables

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows triggering manually from the GitHub Actions tab

jobs:
  build-mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + package with electron-builder
        run: npm run electron:build:mac
        env:
          # Skip macOS code-signing (no certificate required)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yama-Game-macOS
          path: release/*.dmg
          if-no-files-found: error

  build-win:
    name: Windows (.exe installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + package with electron-builder
        run: npm run electron:build:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yama-Game-Windows
          path: release/*.exe
          if-no-files-found: error
