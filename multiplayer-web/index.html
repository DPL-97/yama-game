  for (let i=0;i<4;i++) c += chars[Math.floor(Math.random()*chars.length)];

}

// ---------- Server-Anbindung ----------
async function readRoom(code) {
  try {
    const res = await fetch(`/api/room/${code}`);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}
// Der Server akzeptiert einen Schreibzugriff nur, wenn die Version höher ist
// als die dort gespeicherte, und antwortet immer mit dem autoritativen Stand.
async function writeRoom(room, retries = 1) {
  try {
    const res = await fetch(`/api/room/${room.code}`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(room),
    });
    if (!res.ok) throw new Error("write failed");
    return await res.json();
  } catch (e) {
    if (retries > 0) {
      await new Promise(r => setTimeout(r, 400));
      return writeRoom(room, retries - 1);
    }
    console.error("Raum konnte nicht gespeichert werden:", e);
    return null;
  }
}
function emptyRoom(code) {
  return {
    code, version: 0, phase: "lobby",
    players: { S:null, E:null, N:null, W:null },

const teamOf = (p) => (p==="S"||p==="N" ? "home" : "away");

// ---------- Hilfsfunktionen ----------
function buildDeck() {
  const d=[];
  for(const s of SUIT_KEYS) for(let r=2;r<=14;r++) d.push({suit:s,rank:r,id:`${s}${r}`});
  return d;
}
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pileShuffle(deck, piles) {
  const stacks = Array.from({ length: piles }, () => []);
  deck.forEach((card, i) => stacks[i % piles].push(card));
  const order = shuffle(stacks.map((_, i) => i));
  const result = [];
  order.forEach(idx => result.push(...stacks[idx]));
  return result;
}
function cutDeck(deck) {
  const cut = Math.floor(deck.length * (0.3 + Math.random() * 0.4));
  return [...deck.slice(cut), ...deck.slice(0, cut)];
}
function realisticShuffle(deck) {
  let d = [...deck];
  d = pileShuffle(d, 4);
  d = pileShuffle(d, 3);
  d = pileShuffle(d, 5);
  d = cutDeck(d);
  return d;
}
function sortHandWithTrump(cards, trumpSuit) {
  if(!trumpSuit){
    const order={SP:0,HE:1,DI:2,CL:3};
    return [...cards].sort((a,b)=>order[a.suit]-order[b.suit]||b.rank-a.rank);
  }
  const trumpIsRed = SUIT_INFO[trumpSuit].isRed;
  const nonTrump = SUIT_KEYS.filter(s=>s!==trumpSuit);
  const opp = nonTrump.filter(s=>SUIT_INFO[s].isRed!==trumpIsRed);
  const same = nonTrump.filter(s=>SUIT_INFO[s].isRed===trumpIsRed);
  const ordered=[trumpSuit, opp[0], same[0], opp[1]].filter(Boolean);
  const idx={};ordered.forEach((s,i)=>idx[s]=i);
  return [...cards].sort((a,b)=>idx[a.suit]-idx[b.suit]||b.rank-a.rank);
}
function sortHand(cards){return sortHandWithTrump(cards,null);}
function cardLabel(card){return `${RANK_LABEL[card.rank]}${SUIT_INFO[card.suit].symbol}`;}
function nextInOrder(p){return SEATS[(SEATS.indexOf(p)+1)%4];}
function determineTrickWinner(trick,leadSuit,trumpSuit){
  const tp=trick.filter(t=>t.card.suit===trumpSuit);
  const pool=tp.length>0?tp:trick.filter(t=>t.card.suit===leadSuit);
  let best=pool[0];for(const t of pool)if(t.card.rank>best.card.rank)best=t;
  return best.player;
}
function getCurrentBest(trick,leadSuit,trumpSuit){
  if(trick.length===0)return null;
  const tp=trick.filter(t=>t.card.suit===trumpSuit);
  const pool=tp.length>0?tp:trick.filter(t=>t.card.suit===leadSuit);
  if(pool.length===0)return null;
  let best=pool[0];for(const t of pool)if(t.card.rank>best.card.rank)best=t;
  return best;
}
function detectBestiegen(trick) {
  const bySuit = {};
  trick.forEach((t, i) => {
    if (!bySuit[t.card.suit]) bySuit[t.card.suit] = [];
    bySuit[t.card.suit].push({ ...t, order: i });
  });
  const lowRank = 12, highRank = 13;
  for (const suit of Object.keys(bySuit)) {
    const cards = bySuit[suit];
    const lowIdx = cards.findIndex(c => c.card.rank === lowRank);
    const highIdx = cards.findIndex(c => c.card.rank === highRank);
    if (lowIdx !== -1 && highIdx !== -1 && highIdx > lowIdx) {
      return { suit, lowRank, highRank, lowPlayer: cards[lowIdx].player, highPlayer: cards[highIdx].player };
    }
  }
  return null;
}
function detectFamilie(trick) {
  const bySuit = {};
  trick.forEach(t => {
    if (!bySuit[t.card.suit]) bySuit[t.card.suit] = {};
    bySuit[t.card.suit][t.card.rank] = t.player;
  });
  for (const suit of Object.keys(bySuit)) {
    const ranks = bySuit[suit];
    if (ranks[11] != null && ranks[12] != null && ranks[13] != null) {
      return { suit, jackPlayer: ranks[11], queenPlayer: ranks[12], highPlayer: ranks[13] };
    }
  }
  return null;
}
function isCardPlayable(card, hand, state) {
  if (state.currentTrick.length===0) return true;
  const has = hand.some(c=>c.suit===state.leadSuit);
  if (has) return card.suit===state.leadSuit;
  return true;
}

// ---------- Spiel-Logik ----------
function getNextDeclarer(lastDeclarer, roundWinner) {
  const declarerTeam = teamOf(lastDeclarer);
  if (declarerTeam === roundWinner) return lastDeclarer;
  return nextInOrder(lastDeclarer);
}
function drawRankValue(rank) { return rank === 14 ? 1 : rank; }
function collectPlayedDeck(prevState) {
  if (!prevState || !prevState.trickHistory || prevState.trickHistory.length === 0) {
    return buildDeck();
  }
  const collected = [];
  prevState.trickHistory.forEach(trick => {
    trick.forEach(t => collected.push(t.card));
  });
  if (collected.length !== 52) return buildDeck();
  return collected;
}
function dealNewGame(names, handNumber, scoreHome, scoreAway, dealer, log, declarer, prevState) {
  const trumpDeclarer = declarer ?? dealer;
  const collected = collectPlayedDeck(prevState);
  const deck = prevState ? realisticShuffle(collected) : shuffle(collected);
  const hands = {S:[],E:[],N:[],W:[]};
  deck.forEach((card,i) => hands[SEATS[i%4]].push(card));
  Object.keys(hands).forEach(p => { hands[p] = sortHand(hands[p]); });
  return {
    phase:"trumpSelect", dealer, declarer:trumpDeclarer, hands, names,
    trumpSuit:null, currentTrick:[], leadSuit:null,
    currentTurn:null, tricksByPlayer:{S:0,E:0,N:0,W:0}, trickNumber:0,
    trickComplete:false, trickWinner:null, lastHandResult:null, signals:{},
    trickHistory:[],
    handNumber, scoreHome, scoreAway,
    log:[...log, `Runde ${handNumber}: ${names[dealer]} gibt Karten. ${names[trumpDeclarer]} wählt Trumpf.`],
  };
}
function applySelectTrump(state, suit) {
  const declarer = state.declarer;
  const hands = {};
  Object.keys(state.hands).forEach(p => { hands[p] = sortHandWithTrump(state.hands[p], suit); });
  return {
    ...state, trumpSuit:suit, phase:"playing", hands,
    currentTrick:[], leadSuit:null, currentTurn:declarer, trickNumber:1,
    log:[...state.log,`${state.names[declarer]} bestimmt Trumpf: ${SUIT_INFO[suit].name} ${SUIT_INFO[suit].symbol}.`],
  };
}
function applyPlayCard(state, player, card) {
  const hands = {...state.hands, [player]:state.hands[player].filter(c=>c.id!==card.id)};
  const currentTrick = [...state.currentTrick, {player,card}];
  const isNewLead = state.leadSuit == null;
  const leadSuit = state.leadSuit ?? card.suit;
  let log = [...state.log, `${state.names[player]}: ${cardLabel(card)}`];
  let signals = state.signals;
  if (isNewLead) {
    const consumed = Object.entries(signals || {}).filter(([p, sig]) =>
      sig?.suit === leadSuit && !(p === player && sig?.cardId === card.id)
    );
    if (consumed.length) {
      signals = {...signals};
      consumed.forEach(([p]) => delete signals[p]);
    }
  }
  if (currentTrick.length < 4) {
    return {...state, hands, currentTrick, leadSuit, signals, currentTurn:nextInOrder(player), log};
  }
  const winner = determineTrickWinner(currentTrick, leadSuit, state.trumpSuit);
  const tricksByPlayer = {...state.tricksByPlayer, [winner]:state.tricksByPlayer[winner]+1};
  log = [...log, `${state.names[winner]} gewinnt Stich ${state.trickNumber}.`];
  const familieRaw = detectFamilie(currentTrick);
  const familie = (familieRaw && familieRaw.suit === state.trumpSuit && winner === familieRaw.highPlayer) ? familieRaw : null;
  const bestiegenRaw = !familie ? detectBestiegen(currentTrick) : null;
  const bestiegen = (bestiegenRaw && bestiegenRaw.suit === state.trumpSuit && winner === bestiegenRaw.highPlayer) ? bestiegenRaw : null;
  let event = null;
  if (familie) {
    event = { type:"familie", suit:familie.suit, trickNumber:state.trickNumber };
    log = [...log, `★ FAMILIE in ${SUIT_INFO[familie.suit].name}! ★`];
  } else if (bestiegen) {
    event = { type:"bestiegen", ...bestiegen, trickNumber:state.trickNumber };
    log = [...log, `${RANK_LABEL[bestiegen.lowRank]} bestiegen von ${RANK_LABEL[bestiegen.highRank]} (${SUIT_INFO[bestiegen.suit].name})!`];
  }
  return {...state, hands, currentTrick, leadSuit, signals, tricksByPlayer, trickComplete:true, trickWinner:winner, currentTurn:null, log, pendingEvent:event, eventAcknowledged:!event};
}
function applyClearTrick(state) {
  const signals = state.signals;
  const trickHistory = [...(state.trickHistory || []), state.currentTrick];
  const homeTricks = state.tricksByPlayer.S + state.tricksByPlayer.N;
  const awayTricks = state.tricksByPlayer.E + state.tricksByPlayer.W;
  const decided = homeTricks>=TARGET_TRICKS || awayTricks>=TARGET_TRICKS || state.trickNumber>=13;
  if (decided) {
    const winner = homeTricks>=TARGET_TRICKS?"home" : awayTricks>=TARGET_TRICKS?"away" : homeTricks>awayTricks?"home":"away";
    const loserTricks = winner==="home" ? awayTricks : homeTricks;
    const isSevenZero = loserTricks === 0;
    return {
      ...state, signals, trickHistory, phase:"handEnd", currentTrick:[], trickComplete:false, pendingEvent:null,
      lastHandResult:{winner,homeTricks,awayTricks,isSevenZero},
      scoreHome:state.scoreHome+(winner==="home"?1:0),
      scoreAway:state.scoreAway+(winner==="away"?1:0),
      log:[...state.log,`${winner==="home"?"Team Süd/Nord":"Team Ost/West"} gewinnt die Runde.`],
    };
  }
  return {...state, signals, trickHistory, currentTrick:[], leadSuit:null, currentTurn:state.trickWinner, trickNumber:state.trickNumber+1, trickComplete:false, pendingEvent:null};
}

// ---------- Zentraler Aktions-Reducer ----------
function applyGameAction(prev, seat, action) {
  if (!prev) return prev;
  if (action.type==="selectTrump") {
    if (prev.phase!=="trumpSelect"||prev.declarer!==seat) return prev;
    return applySelectTrump(prev, action.suit);
  }
  if (action.type==="playCard") {
    if (prev.phase!=="playing"||prev.trickComplete||prev.currentTurn!==seat) return prev;
    const card = (prev.hands[seat]||[]).find(c=>c.id===action.card.id);
    if (!card) return prev;
    if (!isCardPlayable(card,prev.hands[seat],prev)) return prev;
    const next = applyPlayCard(prev,seat,card);
    const sig = next.signals?.[seat];
    if (sig && sig.cardId == null) {
      const boundSuit = sig.type === SIGNALS.GEDREHT
        ? (next.leadSuit ?? card.suit)
        : card.suit;
      return {...next, signals:{...next.signals, [seat]:{...sig, cardId:card.id, suit:boundSuit, trickNumber:prev.trickNumber}}};
    }
    return next;
  }
  if (action.type==="signal") {
    if (prev.phase!=="playing"||prev.trickComplete) return prev;
    const ex = prev.signals?.[seat];
    if (ex?.type===action.signalType) {
      const signals={...prev.signals}; delete signals[seat];
      return {...prev,signals,log:[...prev.log,`${prev.names[seat]}: Signal zurückgenommen.`]};
    }
    const lastPlayed = prev.currentTrick.find(t => t.player === seat);
    const sigSuit = action.signalType === SIGNALS.GEDREHT
      ? (prev.leadSuit ?? lastPlayed?.card?.suit)
      : (lastPlayed?.card?.suit ?? prev.leadSuit);
    return {...prev,signals:{...prev.signals,[seat]:{type:action.signalType,suit:sigSuit,cardId:lastPlayed?.card?.id,trickNumber:prev.trickNumber}},
      log:[...prev.log,`${prev.names[seat]}: ${SIGNAL_INFO[action.signalType].emoji} ${SIGNAL_INFO[action.signalType].label}`]};
  }
  if (action.type==="acknowledgeEvent") {
    if (!prev.pendingEvent) return prev;
    return {...prev, eventAcknowledged:true};
  }
  if (action.type==="clearTrick") {
    if (!prev.trickComplete) return prev;
    return applyClearTrick(prev);
  }
  if (action.type==="nextHand") {
    if (prev.phase!=="handEnd") return prev;
    const rw=prev.lastHandResult?.winner;
    const nd=rw?getNextDeclarer(prev.declarer,rw):nextInOrder(prev.dealer);
    return dealNewGame(prev.names,prev.handNumber+1,prev.scoreHome,prev.scoreAway,nextInOrder(prev.dealer),prev.log,nd,prev);
  }
  return prev;
}

// ---------- Animationen ----------
function useSignalAnimation(signalType) {
  const [frame, setFrame] = useState(0);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const prevTypeRef = useRef(null);
  useEffect(() => {
    if (!signalType) { setFrame(0); prevTypeRef.current = null; return; }
    if (signalType === prevTypeRef.current) return;
    prevTypeRef.current = signalType;
    startRef.current = null;
    const duration = signalType === SIGNALS.FESTE ? 500 : 650;
    const animate = (ts) => {
      if (!startRef.current) startRef.current = ts;
      const p = Math.min((ts - startRef.current) / duration, 1);
      setFrame(p);
      if (p < 1) rafRef.current = requestAnimationFrame(animate);
      else setFrame(0);
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => { if(rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [signalType]);
  return frame;
}

}
const Z = { TABLE:1, SIGNAL_BADGE:5, HAND_REST:10, HAND_PRESS:600, HAND_DRAG:900, MODAL:2000 };

function DraggableHandCard({ card, clickable, dim, onPlay, highlight }) {
  const [pressed, setPressed] = useState(false);
  const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch {} };
  const onPointerDown = () => { if (clickable) setPressed(true); };
  const onPointerUp = () => setPressed(false);
  const handleClick = () => {
    if (!clickable) return;
    buzz(18);
    onPlay();
  };
  return (
    <div
      onPointerDown={onPointerDown}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
      onPointerLeave={onPointerUp}
      style={{
        position:"relative",
        touchAction: "pan-x",
        zIndex: pressed ? Z.HAND_PRESS : Z.HAND_REST,

const TRICK_ANIM = {
  enter:               { dur:"0.3s",  ease:"cubic-bezier(0.22,1,0.36,1)" },
  [SIGNALS.GEDREHT]:   { dur:"0.62s", ease:"cubic-bezier(0.16,1,0.3,1)" },
  [SIGNALS.FESTE]:     { dur:"0.42s", ease:"cubic-bezier(0.34,1.56,0.64,1)" },
};
function TrickCell({ play, seat, signal }) {
  const prevCardIdRef = useRef(null);
  const lastSignalKeyRef = useRef(null);
  const [animKey, setAnimKey] = useState(0);
  const [variant, setVariant] = useState("enter");
  useEffect(() => {
    if (!play) {
      prevCardIdRef.current = null;
      lastSignalKeyRef.current = null;
      return;
    }
    const isNewCard = play.card.id !== prevCardIdRef.current;
    const matches = signal && signal.cardId === play.card.id;
    const signalKey = matches ? `${signal.type}:${signal.cardId}` : null;
    const shouldReplay = isNewCard || (signalKey && signalKey !== lastSignalKeyRef.current);
    if (!shouldReplay) return;
    prevCardIdRef.current = play.card.id;
    lastSignalKeyRef.current = signalKey;
    setVariant(matches ? signal.type : "enter");
    setAnimKey(k => k + 1);
  }, [play, signal]);
  const cfg = TRICK_ANIM[variant] || TRICK_ANIM.enter;
  const animName = `cardAnim-${seat}-${variant}`;
  return (
    <div style={{width:50,height:70,display:"flex",alignItems:"center",justifyContent:"center"}}>
      {play ? (
        <div key={animKey} style={{ animation: `${animName} ${cfg.dur} ${cfg.ease} both` }}>
          <CardFace card={play.card} clickable={false}/>
        </div>
      ) : (
        <div style={{width:50,height:70,borderRadius:PXR,border:`3px dashed ${COLORS.neonPurple}33`}}/>
      )}
    </div>
  );
}
function SignalBadge({ signal, hidden }) {
  const frame = useSignalAnimation(!hidden ? signal?.type : null);
  if (!signal || hidden) return null;
  const info = SIGNAL_INFO[signal.type];
  let emojiTransform = "scale(1) rotate(0deg)";
  if (frame > 0 && frame < 1) {
    if (signal.type === SIGNALS.FESTE) {
      const shakeX = Math.sin(frame * Math.PI * 5) * 4;
      const shakeR = Math.sin(frame * Math.PI * 4) * 15;
      const scl = 1 + Math.sin(frame * Math.PI) * 0.4;
      emojiTransform = `translateX(${shakeX}px) rotate(${shakeR}deg) scale(${scl})`;
    } else {
      const deg = frame * 360;
      const scl = 1 + Math.sin(frame * Math.PI) * 0.5;
      emojiTransform = `rotate(${deg}deg) scale(${scl})`;
    }
  }
  const now = Date.now();
  const pulse = 0.85 + 0.15 * Math.sin(now / 700 + (signal.type === SIGNALS.FESTE ? 0 : 1.5));
  return (
    <div style={{
      fontSize:17, fontWeight:900, padding:"5px 10px", borderRadius:PXR, marginTop:4,
      background:COLORS.gold, border:`3px solid ${COLORS.outline}`,
      color:COLORS.outline, display:"flex", alignItems:"center", gap:5,
      boxShadow:`${hardShadow(3,3,COLORS.outline)}, 0 0 ${10*pulse}px rgba(255,198,64,${0.7*pulse})`,
      fontFamily:PIXEL_FONT, letterSpacing:0.5, whiteSpace:"nowrap",
      transform:`scale(${pulse})`,
    }}>
      <span style={{display:"inline-block", fontSize:20, transform:emojiTransform, transition:frame>0&&frame<1?"none":"transform 0.1s"}}>{info.emoji}</span>
      {info.short}
    </div>
  );
}
function PulsingSignalBadge({ signal, hidden }) {
  const [, setTick] = useState(0);
  useEffect(() => {
    if (!signal || hidden) return;
    const id = setInterval(() => setTick(t => t+1), 80);
    return () => clearInterval(id);
  }, [signal?.type, hidden]);
  return <SignalBadge signal={signal} hidden={hidden}/>;
}

                boxShadow: taken ? "none" : hardShadow(2,2,COLORS.outline),
                transform: isHover ? "translate(-1px,-1px)" : "translate(0,0)",
                letterSpacing:0.5, fontFamily:PIXEL_FONT,
              }}
            >
              {name}
            </button>
          );
        })}
      </div>
      {onBack && (
        <button onClick={onBack} style={{marginTop:18,fontSize:13,padding:"10px 16px",borderRadius:PXR,background:COLORS.panelDark,color:COLORS.cream,border:`2px solid #3a2f60`,cursor:"pointer",fontFamily:PIXEL_FONT,fontWeight:700}}>
          ← ZURÜCK
        </button>
      )}
    </ScreenShell>
  );
}

// ---------- Hand-Scrollbar ----------
function HandScrollbar({ scrollRef, deps }) {
  const [thumb, setThumb] = useState({ w:1, x:0 });
  const [pressed, setPressed] = useState(false);
  const dragRef = useRef(null);
  const update = useCallback(() => {
    const el = scrollRef.current;
    if (!el) return;
    const { scrollLeft, scrollWidth, clientWidth } = el;
    if (scrollWidth <= clientWidth + 1) { setThumb({ w:1, x:0 }); return; }
    const w = Math.max(0.14, clientWidth/scrollWidth);
    const maxScroll = scrollWidth - clientWidth;
    const x = maxScroll > 0 ? (scrollLeft/maxScroll) * (1-w) : 0;
    setThumb({ w, x });
  }, [scrollRef]);
  useEffect(() => {
    update();
    const el = scrollRef.current;
    if (!el) return;
    el.addEventListener("scroll", update, { passive:true });
    window.addEventListener("resize", update);
    return () => { el.removeEventListener("scroll", update); window.removeEventListener("resize", update); };
  }, [update, deps]);
  if (thumb.w >= 1) return null;
  const onPointerDown = (e) => {
    const el = scrollRef.current;
    if (!el) return;
    setPressed(true);
    dragRef.current = { startX:e.clientX, startScroll:el.scrollLeft, trackWidth:e.currentTarget.clientWidth };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
  };
  const onPointerMove = (e) => {
    const el = scrollRef.current;
    if (!el || !dragRef.current) return;
    const { startX, startScroll, trackWidth } = dragRef.current;
    const maxScroll = el.scrollWidth - el.clientWidth;
    const delta = ((e.clientX-startX)/trackWidth) * el.scrollWidth;
    el.scrollLeft = Math.max(0, Math.min(maxScroll, startScroll + delta));
  };
  const onPointerUp = () => { setPressed(false); dragRef.current = null; };
  return (
    <div
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
      style={{ padding:"2px 4px 4px", cursor:"pointer", touchAction:"none" }}
    >
      <div style={{
        position:"relative", height: pressed ? 8 : 4, width:"100%",
        background:"rgba(255,255,255,0.08)", borderRadius:4,
        transition:"height 0.15s ease-out",
      }}>
        <div style={{
          position:"absolute", top:0, left:`${thumb.x*100}%`, width:`${thumb.w*100}%`, height:"100%",
          background: pressed ? COLORS.goldLight : "rgba(245,240,255,0.35)",
          borderRadius:4, transition: pressed ? "background 0.15s" : "background 0.15s, left 0.08s ease-out",
        }}/>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────
// BOT-WISSENSSYSTEM
// ─────────────────────────────────────────────────────────────────
function buildBotKnowledge(state, seat) {
  const { trumpSuit, trickHistory = [], currentTrick, hands } = state;
  const playedCards = new Set();
  (trickHistory || []).forEach(trick => trick.forEach(t => playedCards.add(t.card.id)));
  (currentTrick || []).forEach(t => playedCards.add(t.card.id));
  const myHand = hands[seat] || [];
  myHand.forEach(c => playedCards.delete(c.id));
  const fullDeck = [];
  for (const s of SUIT_KEYS) for (let r = 2; r <= 14; r++) fullDeck.push({ suit: s, rank: r, id: `${s}${r}` });
  const remainingCards = fullDeck.filter(c => !playedCards.has(c.id) && !myHand.some(m => m.id === c.id));
  const noSuit = { S: new Set(), E: new Set(), N: new Set(), W: new Set() };
  (trickHistory || []).forEach(trick => {
    const lead = trick[0]?.card?.suit;
    if (!lead) return;
    trick.forEach(t => {
      if (t.card.suit !== lead && t.card.suit !== trumpSuit) {
        noSuit[t.player].add(lead);
      }
    });
    const trickHadTrump = trick.some(t => t.card.suit === trumpSuit);
    if (trickHadTrump) {
      trick.forEach(t => {
        if (t.card.suit !== trumpSuit && t.card.suit !== lead) {
          noSuit[t.player].add(trumpSuit);
        }
      });
    }
  });
  const signals = state.signals || {};
  Object.entries(signals).forEach(([player, sig]) => {
    if (sig?.type === SIGNALS.GEDREHT && sig.suit) {
      noSuit[player]?.add(sig.suit);
    }
  });
  const gedrehtSuits = new Set(
    Object.values(signals).filter(sig => sig?.type === SIGNALS.GEDREHT).map(sig => sig.suit)
  );
  const festeInfo = {};
  Object.entries(signals).forEach(([player, sig]) => {
    if (sig?.type === SIGNALS.FESTE && sig.suit) {
      festeInfo[sig.suit] = { player };
    }
  });
  const myTrumps = myHand.filter(c => c.suit === trumpSuit);
  const remainingTrumps = remainingCards.filter(c => c.suit === trumpSuit);
  const playedTrumps = [...playedCards].filter(id => id.startsWith(trumpSuit)).length;
  const totalTrumps = 13;
  const trumpsOut = totalTrumps - myTrumps.length - playedTrumps;
  const cardStillOut = (suit, rank) => remainingCards.some(c => c.suit === suit && c.rank === rank);
  const myTeam = teamOf(seat);
  const partner = { N:"S", S:"N", E:"W", W:"E" }[seat];
  const homeTricks = state.tricksByPlayer.S + state.tricksByPlayer.N;
  const awayTricks = state.tricksByPlayer.E + state.tricksByPlayer.W;
  const myTeamTricks = myTeam === "home" ? homeTricks : awayTricks;
  const oppTeamTricks = myTeam === "home" ? awayTricks : homeTricks;
  const tricksLeft = 13 - state.trickNumber + 1;
  return {
    remainingCards, remainingTrumps, playedCards, noSuit, trumpsOut, cardStillOut,
    myTeamTricks, oppTeamTricks, tricksLeft, partner, myTeam, gedrehtSuits, festeInfo,
  };
}

// ─────────────────────────────────────────────────────────────────
// BOT-KI
// ─────────────────────────────────────────────────────────────────
function lowestOfTopSequence(safeCardsOfSuit) {
  if (!safeCardsOfSuit.length) return null;
  const sorted = safeCardsOfSuit.slice().sort((a, b) => b.rank - a.rank);
  let run = [sorted[0]];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i - 1].rank - sorted[i].rank === 1) run.push(sorted[i]);
    else break;

  return run[run.length - 1];
}
function isSafeWinner(card, trumpSuit, hand, knowledge) {
  const { cardStillOut, remainingCards } = knowledge;
  if (card.suit === trumpSuit) {
    const higherTrumpsOut = remainingCards.some(c => c.suit === trumpSuit && c.rank > card.rank);
    return !higherTrumpsOut;
  }
  const trumpsStillOut = card.suit !== trumpSuit && remainingCards.some(c => c.suit === trumpSuit);
  if (trumpsStillOut) return false;
  for (let r = 14; r > card.rank; r--) {
    const inOwnHand = hand.some(c => c.suit === card.suit && c.rank === r);
    if (inOwnHand) continue;
    if (cardStillOut(card.suit, r)) return false;

}
function botChooseLead(hand, state, knowledge) {
  const { partner, noSuit, remainingCards, oppTeamTricks } = knowledge;
  const pSig = state.signals?.[partner];
  const by = {}; SUIT_KEYS.forEach(s => by[s] = []);
  hand.forEach(c => by[c.suit].push(c));
  const sevenZeroAlive = oppTeamTricks === 0;
  const safeBySuit = {};
  for (const s of SUIT_KEYS) {
    safeBySuit[s] = by[s].filter(c => isSafeWinner(c, state.trumpSuit, hand, knowledge));
  }
  const totalSafe = Object.values(safeBySuit).flat();
  if (pSig?.type === SIGNALS.FESTE || pSig?.type === SIGNALS.GEDREHT) {
    const sigSuit = pSig.suit;
    const safeElsewhere = SUIT_KEYS.some(s => s !== sigSuit && safeBySuit[s]?.length > 0);
    if (!safeElsewhere) {
      if (sigSuit && by[sigSuit]?.length) {
        return by[sigSuit].slice().sort((a, b) => a.rank - b.rank)[0];
      }
      const fallback = SUIT_KEYS.filter(s => s !== state.trumpSuit && by[s]?.length > 0);
      if (fallback.length > 0) {
        const best = fallback.sort((a, b) => by[b].length - by[a].length)[0];
        return by[best].slice().sort((a, b) => a.rank - b.rank)[0];
      }
    }
  }
  if (sevenZeroAlive && totalSafe.length > 0) {
    const safeTrumps = safeBySuit[state.trumpSuit] || [];
    if (safeTrumps.length > 0) {
      if (safeTrumps.length > 1) {
        return lowestOfTopSequence(safeTrumps);
      }
      return safeTrumps.slice().sort((a, b) => b.rank - a.rank)[0];
    }
    for (const s of SUIT_KEYS) {
      if (safeBySuit[s].length > 1) return lowestOfTopSequence(safeBySuit[s]);
    }
    return totalSafe.slice().sort((a, b) => b.rank - a.rank)[0];
  }
  const oppSeats = SEATS.filter(s => teamOf(s) !== knowledge.myTeam);
  const oppHasNoTrump = oppSeats.every(s => noSuit[s]?.has(state.trumpSuit));
  if (oppHasNoTrump && by[state.trumpSuit]?.length === 0) {
    const allCards = hand.slice().sort((a, b) => b.rank - a.rank);
    if (allCards.length) return allCards[0];
  }
  if (totalSafe.length > 0) {
    for (const s of SUIT_KEYS) {
      if (safeBySuit[s].length > 1) return lowestOfTopSequence(safeBySuit[s]);
    }
    return totalSafe.slice().sort((a, b) => b.rank - a.rank)[0];
  }
  const myTrumps = by[state.trumpSuit] || [];
  const oppTrumpsOut = remainingCards.filter(c => c.suit === state.trumpSuit).length;
  if (myTrumps.length >= 2 && oppTrumpsOut > 0) {
    const highTrumps = myTrumps.filter(c => c.rank >= 12);
    if (highTrumps.length > 0) {
      return highTrumps.slice().sort((a, b) => b.rank - a.rank)[0];
    }
  }
  const oppSeatsArr = SEATS.filter(s => teamOf(s) !== knowledge.myTeam);
  for (const s of SUIT_KEYS) {
    if (s === state.trumpSuit) continue;
    const oppMissingThis = oppSeatsArr.some(op => noSuit[op]?.has(s));
    const oppHasFeste = knowledge.festeInfo?.[s] && oppSeatsArr.includes(knowledge.festeInfo[s].player);
    if (!oppMissingThis && !oppHasFeste && by[s]?.length > 0) {
      return by[s].slice().sort((a, b) => a.rank - b.rank)[0];
    }
  }
  const nonTrump = SUIT_KEYS.filter(s => s !== state.trumpSuit && by[s].length > 0);
  if (nonTrump.length > 0) {
    const best = nonTrump.slice().sort((a, b) => by[b].length - by[a].length)[0];
    return by[best].slice().sort((a, b) => a.rank - b.rank)[0];
  }
  return hand.slice().sort((a, b) => a.rank - b.rank)[0];
}
function botChooseFollow(playable, state, knowledge) {
  const { remainingCards, remainingTrumps, oppTeamTricks, tricksLeft, festeInfo } = knowledge;
  const best = getCurrentBest(state.currentTrick, state.leadSuit, state.trumpSuit);
  const partnerWinning = best && teamOf(best.player) === teamOf(state.currentTurn);
  const isLastToPlay = state.currentTrick.length === 3;
  const bestIsTrump = best && best.card.suit === state.trumpSuit;
  const partnerTrumped = partnerWinning && bestIsTrump;
  const sevenZeroAlive = oppTeamTricks === 0;
  const partnerHasFesteForLead = state.leadSuit
    && festeInfo?.[state.leadSuit]?.player === knowledge.partner;
  function bestDiscard(cards) {
    const nonTrump = cards.filter(c => c.suit !== state.trumpSuit);
    const pool = nonTrump.length > 0 ? nonTrump : cards;
    const bySuit = {};
    pool.forEach(c => { (bySuit[c.suit] = bySuit[c.suit] || []).push(c); });
    const suits = Object.keys(bySuit).sort((a, b) => bySuit[a].length - bySuit[b].length);
    const targetSuit = suits[0];
    return bySuit[targetSuit].slice().sort((a, b) => a.rank - b.rank)[0]
      ?? pool.slice().sort((a, b) => a.rank - b.rank)[0];
  }
  const aceOfLead = state.leadSuit && playable.find(c => c.suit === state.leadSuit && c.rank === 14);
  if (aceOfLead && !bestIsTrump && !partnerWinning) return aceOfLead;
  if (partnerWinning) {
    if (partnerTrumped) {
      const nonTrumpPlayable = playable.filter(c => c.suit !== state.trumpSuit);
      if (nonTrumpPlayable.length > 0) {
        return bestDiscard(nonTrumpPlayable);
      }
      if (sevenZeroAlive) {
        const oppStillToAct = SEATS.filter(s => teamOf(s) !== knowledge.myTeam)
          .some(s => !state.currentTrick.some(t => t.player === s));
        const higherTrumpThreatOut = remainingCards.some(c => c.suit === state.trumpSuit && c.rank > best.card.rank);
        if (oppStillToAct && higherTrumpThreatOut) {
          const overTrump = playable.filter(c => c.suit === state.trumpSuit && c.rank > best.card.rank);
          if (overTrump.length > 0) return overTrump.slice().sort((a, b) => a.rank - b.rank)[0];
        }
      }
      return playable.slice().sort((a, b) => a.rank - b.rank)[0];
    }
    if (sevenZeroAlive && isLastToPlay) {
      return bestDiscard(playable);
    }
    return bestDiscard(playable);
  }
  const winners = playable.filter(c => {
    if (!best) return true;
    const cIsTrump = c.suit === state.trumpSuit;
    if (bestIsTrump) return cIsTrump && c.rank > best.card.rank;
    if (cIsTrump) return true;
    if (c.suit !== state.leadSuit) return false;
    return c.rank > best.card.rank;
  });
  if (partnerHasFesteForLead && !sevenZeroAlive && winners.length > 0) {
    const partnerStillToPlay = !state.currentTrick.some(t => t.player === knowledge.partner);
    if (partnerStillToPlay) {
      return bestDiscard(playable);
    }
  }
  if (winners.length > 0) {
    if (sevenZeroAlive) {
      return winners.slice().sort((a, b) => b.rank - a.rank)[0];
    }
    const minWinner = winners.slice().sort((a, b) => a.rank - b.rank)[0];
    if (tricksLeft <= 3 && winners.some(c => c.rank === 14)) {
      return winners.find(c => c.rank === 14);
    }
    if (!bestIsTrump && !isLastToPlay) {
      const oppStillToPlay = SEATS.filter(s => teamOf(s) !== knowledge.myTeam)
        .some(s => !state.currentTrick.some(t => t.player === s));
      const cheapTrumpAvailable = playable.some(c => c.suit === state.trumpSuit);
      if (oppStillToPlay && cheapTrumpAvailable && minWinner.suit !== state.trumpSuit) {
        const trumpsStillOut = remainingTrumps.length > 0;
        if (trumpsStillOut) return bestDiscard(playable);
      }
    }
    return minWinner;
  }
  return bestDiscard(playable);
}
function botChooseCard(hand, state) {
  const playable = hand.filter(c => isCardPlayable(c, hand, state));
  if (!playable.length) return hand[0];
  const knowledge = buildBotKnowledge(state, state.currentTurn);
  if (state.currentTrick.length === 0) {
    return botChooseLead(playable, state, knowledge);
  }
  return botChooseFollow(playable, state, knowledge);
}
function botChooseTrump(hand) {
  const score = {};
  SUIT_KEYS.forEach(s => {
    const cards = hand.filter(c => c.suit === s);
    score[s] = cards.length * 2
      + cards.filter(c => c.rank === 14).length * 4
      + cards.filter(c => c.rank === 13).length * 3
      + cards.filter(c => c.rank === 12).length * 2
      + cards.filter(c => c.rank === 11).length * 1;
  });
  return SUIT_KEYS.reduce((a, b) => score[b] > score[a] ? b : a);
}
function botDecideSignal(seat, card, state) {
  if (state.currentTrick.length !== 0) return null;
  const suitCards = state.hands[seat].filter(c => c.suit === card.suit && c.id !== card.id);
  if (suitCards.length === 0) return SIGNALS.GEDREHT;
  const maxRemaining = Math.max(...suitCards.map(c => c.rank));
  if (card.rank > maxRemaining && card.rank >= 10) return SIGNALS.FESTE;
  if (card.suit === state.trumpSuit && card.rank >= 12) return SIGNALS.FESTE;
  if (card.rank === 14) return SIGNALS.FESTE;

}
function botTakeTurn(gs) {
  const seat = gs.currentTurn;
  const card = botChooseCard(gs.hands[seat]||[], gs);
  if (!card) return gs;
  const sig = botDecideSignal(seat, card, gs);
  let s = gs;
  if (sig) s = {...gs, signals:{...gs.signals,[seat]:{type:sig,suit:card.suit,cardId:card.id,trickNumber:gs.trickNumber}},
    log:[...gs.log,`${gs.names[seat]}: ${SIGNAL_INFO[sig].emoji} ${SIGNAL_INFO[sig].label}`]};
  return applyPlayCard(s, seat, card);
}

function SpreadCard({ index, faceDown, card, picked, dimmed, clickable, onClick, highlight, takenByOpponent }) {
  const perRow = 5;
  const col = index % perRow;
  const midCol = (perRow - 1) / 2;
  const offset = col - midCol;
  const seed = (index * 53) % 17;
  const rotate = offset * 3.5 + (seed - 8) * 0.5;
  const translateY = (seed % 5) - 2;
  return (
    <button
      onClick={clickable ? onClick : undefined}
      disabled={!clickable}
      style={{
        position:"relative",
        transform:`translateY(${translateY}px) rotate(${rotate}deg)`,
        cursor: clickable ? "pointer" : "default",
        transition:"transform 0.18s steps(3), filter 0.15s, opacity 0.15s",
        filter: dimmed ? "brightness(0.45)" : "none",
        opacity: takenByOpponent ? 0.25 : 1,
        background:"none", border:"none", padding:6, margin:-6,
        justifySelf:"center",
        zIndex: picked ? 20 : 1,
        minWidth:44, minHeight:44, display:"flex", alignItems:"center", justifyContent:"center",
      }}
      onMouseEnter={e=>{ if(clickable) e.currentTarget.style.transform=`translateY(${translateY-8}px) rotate(${rotate}deg)`; }}
      onMouseLeave={e=>{ e.currentTarget.style.transform=`translateY(${translateY}px) rotate(${rotate}deg)`; }}
    >
      {faceDown ? <CardBack/> : <CardFace card={card} clickable={false} highlight={highlight}/>}
    </button>
  );
}
function DrawScreen({ names, onDone }) {

  const [awayIdx, setAwayIdx] = useState(null);

  const homeRep = "S";
  const awayRep = "E";

  const awayCard = awayIdx != null ? spread[awayIdx] : null;
  function pickMyCard(i) {
    if (homeIdx != null) return;
    setHomeIdx(i);
    setPhase("cpuDrawing");
    setTimeout(() => {
      const remaining = spread.map((_, idx) => idx).filter(idx => idx !== i);
      const cpuIdx = remaining[Math.floor(Math.random() * remaining.length)];
      setAwayIdx(cpuIdx);
      const hv = drawRankValue(spread[i].rank);
      const av = drawRankValue(spread[cpuIdx].rank);
      if (hv === av) setPhase("tieAnnounce");
      else setPhase("result");
    }, 900);
  }
  function redraw() {
    const remainingInDeck = deck.slice(usedCount);
    const poolSize = Math.min(remainingInDeck.length, Math.max(2, SPREAD_SIZE - tieRound * 2 - 2));
    const nextSpread = remainingInDeck.slice(0, poolSize);
    setSpread(nextSpread);
    setUsedCount(usedCount + poolSize);
    setTieRound(tieRound + 1);
    setHomeIdx(null);
    setAwayIdx(null);
    setPhase("home");
  }
  function getWinner() {
    if (!homeCard || !awayCard) return null;
    const hv = drawRankValue(homeCard.rank);
    const av = drawRankValue(awayCard.rank);
    if (hv > av) return "home";
    if (av > hv) return "away";
    return "tie";
  }
  const winner = getWinner();
  const firstDeclarer = winner === "away" ? awayRep : homeRep;
  return (
    <div style={{minHeight:"100vh",minHeight:"100dvh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",

          : phase === "cpuDrawing"
            ? <React.Fragment>{names[awayRep]} wählt jetzt eine Karte …</React.Fragment>
            : phase === "tieAnnounce"
              ? <React.Fragment>Gleichstand! Es wird mit den übrigen Karten neu gezogen.</React.Fragment>
              : <React.Fragment>Wer höher zieht, bestimmt den Trumpf.</React.Fragment>}
      </p>
      <div style={{
        display:"grid", gridTemplateColumns:`repeat(${Math.min(5, spread.length)}, 1fr)`, gridTemplateRows:"repeat(2, auto)",
        columnGap:10, rowGap:14,

        {spread.map((card, i) => (
          <SpreadCard key={card.id} index={i}
            faceDown={i !== homeIdx && i !== awayIdx}
            card={card}
            picked={i === homeIdx || i === awayIdx}
            dimmed={homeIdx != null && i !== homeIdx && i !== awayIdx}
            clickable={phase === "home"}
            onClick={() => pickMyCard(i)}
            highlight={(i === homeIdx && winner==="home") || (i === awayIdx && winner==="away")}

        ))}
      </div>
      <div style={{display:"flex",gap:14,justifyContent:"center",alignItems:"flex-start",width:"100%",maxWidth:340,marginBottom:8}}>
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
          <div style={{fontSize:13,opacity:0.45,letterSpacing:1}}>DU</div>

            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{fontSize:15,opacity:0.85,fontWeight:700,color:winner==="home"?COLORS.neonGreen:COLORS.cream}}>
                {homeCard.rank === 14 ? "Ass = 1" : `${RANK_LABEL[homeCard.rank]} = ${drawRankValue(homeCard.rank)}`}
                {" "}<span style={{color:SUIT_INFO[homeCard.suit].color}}>{SUIT_INFO[homeCard.suit].symbol}</span>
              </div>
              {winner==="home" && <div style={{fontSize:14,color:COLORS.neonGreen,fontWeight:900,letterSpacing:0.5}}>✦ DU GEWINNST!</div>}
            </div>
          ) : <div style={{fontSize:14,opacity:0.35}}>—</div>}
        </div>
        <div style={{paddingTop:14,fontSize:17,opacity:0.3,fontWeight:900,letterSpacing:1}}>VS</div>
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
          <div style={{fontSize:13,opacity:0.45,letterSpacing:1}}>CPU</div>
          <div style={{fontSize:15,fontWeight:900,color:COLORS.goldLight}}>{names[awayRep]}</div>
          {awayCard ? (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{fontSize:15,opacity:0.85,fontWeight:700,color:winner==="away"?COLORS.neonGreen:COLORS.cream}}>
                {awayCard.rank === 14 ? "Ass = 1" : `${RANK_LABEL[awayCard.rank]} = ${drawRankValue(awayCard.rank)}`}
                {" "}<span style={{color:SUIT_INFO[awayCard.suit].color}}>{SUIT_INFO[awayCard.suit].symbol}</span>
              </div>
              {winner==="away" && <div style={{fontSize:14,color:COLORS.neonGreen,fontWeight:900,letterSpacing:0.5}}>✦ CPU GEWINNT!</div>}
            </div>
          ) : phase === "cpuDrawing" ? (

          ) : <div style={{fontSize:14,opacity:0.35}}>—</div>}

      </div>
      <div style={{width:"100%", maxWidth:320}}>
        {phase === "tieAnnounce" && (
          <div style={{textAlign:"center",width:"100%"}}>

        {phase === "result" && (
          <div style={{textAlign:"center",width:"100%"}}>
            <div style={{marginBottom:16,padding:"10px 16px",borderRadius:PXR,background:COLORS.panel,border:`2px solid #3a2f60`}}>
              <p style={{fontSize:16,margin:0}}>
                <strong style={{color:COLORS.goldLight}}>{names[firstDeclarer]}</strong> bestimmt den Trumpf!
              </p>
            </div>
            <BigButton onClick={()=>onDone(firstDeclarer)}>SPIEL STARTEN 🎴</BigButton>
          </div>
        )}
      </div>
      <style>{`html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}`}</style>
    </div>
  );
}

function CPUMode({ playerName }) {
  const OTHER_NAMES = PERSONAS.filter(n => n !== playerName);
  const CPU_NAMES = {
    S: playerName,
    E: OTHER_NAMES[0] || "Aaron",
    N: OTHER_NAMES[1] || "Grace",
    W: OTHER_NAMES[2] || "Denny",
  };
  const [appPhase, setAppPhase] = useState("draw");
  const [gs, setGs] = useState(null);

  function handleDrawDone(declarer) {
    setGs(dealNewGame(CPU_NAMES, 1, 0, 0, declarer, ["Spiel gestartet!"], declarer));
    setAppPhase("playing");
  }
  function dispatch(action) {
    setGs(prev => applyGameAction(prev, "S", action));
  }
  useEffect(()=>{
    if(!gs||gs.phase!=="trumpSelect"||gs.declarer==="S") return;
    const t=setTimeout(()=>setGs(p=>p&&p.phase==="trumpSelect"&&p.declarer!=="S"
      ?applySelectTrump(p,botChooseTrump(p.hands[p.declarer]||[])):p),900);
    return()=>clearTimeout(t);
  },[gs?.phase,gs?.declarer]);
  useEffect(()=>{
    if(!gs||gs.phase!=="playing"||gs.trickComplete||!gs.currentTurn||gs.currentTurn==="S") return;
    const seat=gs.currentTurn;
    const t=setTimeout(()=>{
      setGs(p=>{
        if(!p||p.currentTurn!==seat||p.trickComplete) return p;
        return botTakeTurn(p);
      });
    },650+Math.random()*400);
    return()=>clearTimeout(t);
  },[gs?.currentTurn,gs?.phase,gs?.trickComplete,gs?.trickNumber]);
  useEffect(()=>{
    if(!gs?.trickComplete) return;
    if(gs.pendingEvent && !gs.eventAcknowledged) return;
    const t=setTimeout(()=>setGs(p=>p?.trickComplete?applyClearTrick(p):p),1100);
    return()=>clearTimeout(t);
  },[gs?.trickComplete,gs?.trickNumber,gs?.pendingEvent,gs?.eventAcknowledged]);

  if (appPhase === "draw") {
    return <DrawScreen names={CPU_NAMES} onDone={handleDrawDone}/>;
  }
  if(!gs) return null;
  return <GameView gameState={gs} mySeat="S" myHand={gs.hands["S"]} onAction={dispatch}
    botSeats={["E","N","W"]}
    onNewGame={()=>setGs(dealNewGame(CPU_NAMES,1,0,0,"S",["Neues Spiel."],"S"))}/>;
}

function OnlineEntryScreen({ onRoomReady, onBack }) {
  const [mode, setMode] = useState(null);
  const [codeInput, setCodeInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function createRoom() {
    setBusy(true); setError(null);
    // Bis zu 5 Versuche, einen noch nicht vergebenen Code zu finden
    for (let i = 0; i < 5; i++) {
      const code = genRoomCode();
      const existing = await readRoom(code);
      if (existing) continue;
      const room = emptyRoom(code);
      const server = await writeRoom(room);
      setBusy(false);
      if (!server) { setError("Server nicht erreichbar. Läuft server.js?"); return; }
      onRoomReady(server, true);
      return;
    }
    setBusy(false);
    setError("Kein freier Raumcode gefunden. Nochmal versuchen.");
  }
  async function joinRoom() {
    const code = codeInput.trim().toUpperCase();
    if (code.length !== 4) { setError("Code hat 4 Buchstaben."); return; }
    setBusy(true); setError(null);
    const room = await readRoom(code);
    setBusy(false);
    if (!room) { setError(`Raum "${code}" nicht gefunden.`); return; }
    onRoomReady(room, false);
  }

  return (
    <ScreenShell>
      <TitleBadge subtitle="ONLINE MULTIPLAYER"/>

            <BigButton onClick={()=>setMode("join")} color={COLORS.neonBlue}>

          <React.Fragment>
            <input
              value={codeInput}
              onChange={e=>setCodeInput(e.target.value.toUpperCase().slice(0,4))}

              style={{
                width:"100%", boxSizing:"border-box", padding:"14px", fontSize:26, fontWeight:900,
                textAlign:"center", letterSpacing:10, borderRadius:PXR,
                background:COLORS.panelDark, color:COLORS.goldLight,
                border:`3px solid ${COLORS.neonPurple}`, outline:"none",
                fontFamily:PIXEL_FONT, textTransform:"uppercase",

function OnlineLobby({ initialRoom, isCreator, onEnterGame, onBack }) {
  const [room, setRoom] = useState(initialRoom);
  const roomRef = useRef(initialRoom);
  const [mySeat, setMySeat] = useState(null);
  const [myName, setMyName] = useState(null);
  const [pickingPersonaFor, setPickingPersonaFor] = useState(null);
  const [reclaimSeat, setReclaimSeat] = useState(null);
  const [copied, setCopied] = useState(false);
  const mySeatRef = useRef(null);
  useEffect(()=>{ mySeatRef.current = mySeat; },[mySeat]);

  async function commit(next) {
    const withVer = {...next, version:(roomRef.current?.version??0)+1, updatedAt:Date.now()};
    roomRef.current = withVer; setRoom(withVer);
    const server = await writeRoom(withVer);
    // Der Server ist immer autoritativ. Weicht seine zurückgegebene Version von
    // unserer ab (egal ob höher ODER gleich/niedriger, weil unser Schreibzugriff
    // wegen eines gleichzeitigen Commits eines anderen Clients abgelehnt wurde),
    // MUSS der zurückgegebene Stand übernommen werden – sonst glaubt dieser
    // Client fälschlich, sein eigener (in Wahrheit verworfener) Stand sei aktiv.
    if (server && server.version !== withVer.version) { roomRef.current = server; setRoom(server); }
  }

  useEffect(() => {
    const id = setInterval(async () => {
      const remote = await readRoom(initialRoom.code);
      if (remote && remote.version > (roomRef.current?.version ?? -1)) {
        roomRef.current = remote;
        setRoom(remote);
      }
      const r = roomRef.current;
      if (r && mySeatRef.current && r.host !== mySeatRef.current) {
        const stale = Date.now() - r.updatedAt > HOST_TIMEOUT_MS;
        const humanSeats = SEATS.filter(s => r.players[s] && !r.players[s].bot);
        const seniorSeat = humanSeats[0];
        if (stale && seniorSeat === mySeatRef.current) {
          commit({...r, host: mySeatRef.current});
        }
      }
    }, POLL_MS);
    return () => clearInterval(id);
  }, [initialRoom.code]);

  useEffect(() => {
    if (room.phase === "playing" && mySeat && myName) {
      onEnterGame(room, mySeat, myName);
    }
  }, [room.phase, mySeat, myName]);

  const takenPersonas = SEATS.map(s => room.players[s]?.name).filter(Boolean);
  const isHost = mySeat != null && room.host === mySeat;
  const humanCount = SEATS.filter(s => room.players[s] && !room.players[s].bot).length;

  async function claimSeat(seat, name) {
    const r = roomRef.current;
    const next = {
      ...r,
      players: {...r.players, [seat]: {name, bot:false}},
      host: r.host ?? seat,
    };
    setMySeat(seat); setMyName(name);
    await commit(next);
  }
  async function leaveSeat() {
    const r = roomRef.current;
    if (!mySeat) { onBack(); return; }
    const next = {
      ...r,
      players: {...r.players, [mySeat]: null},
      host: r.host === mySeat ? (SEATS.find(s => s!==mySeat && r.players[s] && !r.players[s].bot) ?? null) : r.host,
    };
    setMySeat(null); setMyName(null);
    await commit(next);
    onBack();
  }
  function doReclaim(seat) {
    const p = roomRef.current.players[seat];
    if (!p) return;
    setMySeat(seat); setMyName(p.name);
    setReclaimSeat(null);
  }
  async function startGame() {
    const r = roomRef.current;
    const players = {...r.players};
    const used = SEATS.map(s => players[s]?.name).filter(Boolean);
    const freePersonas = PERSONAS.filter(n => !used.includes(n));
    let fi = 0;
    SEATS.forEach(s => {
      if (!players[s]) { players[s] = { name: freePersonas[fi++] || `Bot-${s}`, bot:true }; }
    });
    const names = { S:players.S.name, E:players.E.name, N:players.N.name, W:players.W.name };
    const drawDeck = shuffle(buildDeck());
    let bestSeat = SEATS[0], bestVal = -1;
    const drawLog = [];
    SEATS.forEach((s,i) => {
      const c = drawDeck[i];
      const v = drawRankValue(c.rank);
      drawLog.push(`${names[s]} zieht ${cardLabel(c)} (=${v})`);
      if (v > bestVal) { bestVal = v; bestSeat = s; }
    });
    const gs = dealNewGame(names, 1, 0, 0, bestSeat,
      ["Losverfahren: " + drawLog.join(", ") + `. ${names[bestSeat]} bestimmt den Trumpf!`],
      bestSeat, null);
    await commit({...r, players, phase:"playing", gs});
  }

  if (pickingPersonaFor) {
    return <PersonaSelectScreen
      takenPersonas={takenPersonas}
      subtitle={`PERSONA FÜR SITZ ${SEAT_LABEL[pickingPersonaFor].toUpperCase()}`}
      onSelect={(name)=>{ claimSeat(pickingPersonaFor, name); setPickingPersonaFor(null); }}
      onBack={()=>setPickingPersonaFor(null)}
    />;
  }

  const teamColor = (seat) => teamOf(seat)==="home" ? COLORS.neonGreen : COLORS.neonBlue;

  return (
    <ScreenShell>
      <TitleBadge subtitle="LOBBY"/>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
        <div style={{
          padding:"8px 18px",borderRadius:PXR,background:COLORS.panel,
          border:`3px solid ${COLORS.gold}`,boxShadow:hardShadow(3,3,COLORS.outline),
          fontSize:26,fontWeight:900,letterSpacing:8,color:COLORS.goldLight,
        }}>{room.code}</div>
        <button onClick={async()=>{
          try { await navigator.clipboard.writeText(window.location.origin + "  →  Code: " + room.code); setCopied(true); setTimeout(()=>setCopied(false),1500); } catch {}
        }} style={{width:44,height:44,borderRadius:PXR,background:COLORS.panelDark,border:`2px solid #3a2f60`,color:copied?COLORS.neonGreen:COLORS.cream,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <Copy size={16}/>
        </button>
      </div>
      <p style={{fontSize:13,opacity:0.5,marginBottom:16,textAlign:"center",lineHeight:1.6}}>
        Teile die Seiten-Adresse + den Code mit deinen Freunden.<br/>
        Team <span style={{color:COLORS.neonGreen}}>Süd+Nord</span> vs Team <span style={{color:COLORS.neonBlue}}>Ost+West</span>
      </p>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,width:"100%",maxWidth:340,marginBottom:18}}>
        {SEATS.map(seat => {
          const p = room.players[seat];
          const isMine = seat === mySeat;
          return (
            <button key={seat}
              onClick={()=>{
                if (isMine) return;
                if (!p) {
                  if (mySeat) return;
                  setPickingPersonaFor(seat);
                } else if (!p.bot && !mySeat) {
                  setReclaimSeat(seat);
                }
              }}
              style={{
                padding:"14px 8px", minHeight:76, borderRadius:PXR,
                background: isMine ? COLORS.gold : p ? COLORS.panel : COLORS.panelDark,
                border:`3px solid ${isMine ? COLORS.outline : p ? teamColor(seat) : "#3a2f60"}`,
                color: isMine ? COLORS.outline : COLORS.cream,
                cursor: (!p && !mySeat) || (p && !p.bot && !mySeat) ? "pointer" : "default",
                boxShadow: hardShadow(2,2,COLORS.outline),
                display:"flex",flexDirection:"column",alignItems:"center",gap:4,
                fontFamily:PIXEL_FONT,
              }}>
              <span style={{fontSize:11,letterSpacing:1,opacity:0.6,fontWeight:700}}>
                {SEAT_LABEL[seat].toUpperCase()} · {teamOf(seat)==="home"?"TEAM 1":"TEAM 2"}
              </span>
              <span style={{fontSize:16,fontWeight:900}}>
                {p ? `${p.bot?"🤖 ":""}${p.name}${isMine?" ✦":""}` : "FREI"}
              </span>
              {!p && !mySeat && <span style={{fontSize:11,opacity:0.5}}>antippen</span>}
              {room.host===seat && p && <span style={{fontSize:10,color:isMine?COLORS.outline:COLORS.goldLight,letterSpacing:1}}>★ HOST</span>}
            </button>
          );
        })}
      </div>

      {reclaimSeat && (
        <div style={{position:"fixed",inset:0,zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:"rgba(8,5,18,0.7)"}}>
          <div style={{width:"100%",maxWidth:300,borderRadius:PXR*2,padding:20,background:COLORS.panel,border:`3px solid ${COLORS.neonPurple}`,boxShadow:hardShadow(4,4,COLORS.outline)}}>
            <p style={{fontSize:15,marginBottom:16,textAlign:"center",lineHeight:1.6,color:COLORS.cream}}>
              Als <strong style={{color:COLORS.goldLight}}>{room.players[reclaimSeat]?.name}</strong> wieder einsteigen?<br/>
              <span style={{opacity:0.5,fontSize:13}}>(z.B. nach einem Seiten-Reload)</span>
            </p>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setReclaimSeat(null)} style={{flex:1,padding:"12px 0",borderRadius:PXR,background:COLORS.panelDark,color:COLORS.cream,border:`2px solid #3a2f60`,cursor:"pointer",fontWeight:900,fontFamily:PIXEL_FONT,fontSize:14}}>NEIN</button>
              <button onClick={()=>doReclaim(reclaimSeat)} style={{flex:1,padding:"12px 0",borderRadius:PXR,fontWeight:900,background:COLORS.gold,color:COLORS.outline,border:`2px solid ${COLORS.outline}`,cursor:"pointer",fontFamily:PIXEL_FONT,fontSize:14}}>JA ✦</button>
            </div>
          </div>
        </div>
      )}

      <div style={{width:"100%",maxWidth:340,display:"flex",flexDirection:"column",gap:10}}>
        {isHost ? (
          <React.Fragment>
            <BigButton onClick={startGame} disabled={!mySeat}>
              SPIEL STARTEN 🎴
            </BigButton>
            <p style={{fontSize:12,opacity:0.45,textAlign:"center",lineHeight:1.5,margin:0}}>
              Freie Plätze werden automatisch mit 🤖 Bots besetzt.<br/>
              {humanCount} Spieler verbunden.
            </p>
          </React.Fragment>
        ) : mySeat ? (
          <div style={{padding:"12px",borderRadius:PXR,background:COLORS.panelDark,border:`2px dashed #3a2f60`,fontSize:14,textAlign:"center",opacity:0.7}}>
            Warte auf den Host … ({humanCount} Spieler verbunden)
          </div>
        ) : (
          <div style={{padding:"12px",borderRadius:PXR,background:COLORS.panelDark,border:`2px dashed #3a2f60`,fontSize:14,textAlign:"center",opacity:0.7}}>
            Wähle zuerst einen freien Sitzplatz.
          </div>
        )}
        <button onClick={leaveSeat} style={{fontSize:13,padding:"10px",borderRadius:PXR,background:"transparent",color:COLORS.cream,border:`2px solid #3a2f60`,cursor:"pointer",fontFamily:PIXEL_FONT,fontWeight:700,opacity:0.7}}>
          ← RAUM VERLASSEN
        </button>
      </div>
    </ScreenShell>
  );
}

function OnlineGame({ initialRoom, mySeat, myName, onLeave }) {
  const [room, setRoom] = useState(initialRoom);
  const roomRef = useRef(initialRoom);
  const [connState, setConnState] = useState("ok");
  const isHost = room.host === mySeat;
  const gs = room.gs;
  const botSeats = SEATS.filter(s => room.players[s]?.bot);

  // commit() gibt zurück, ob der Schreibzugriff vom Server tatsächlich
  // übernommen wurde ({accepted:true}) oder wegen eines gleichzeitigen
  // Commits eines anderen Clients abgelehnt wurde ({accepted:false}).
  // WICHTIG: Ein abgelehnter Schreibzugriff muss erkannt werden, sobald die
  // vom Server zurückgegebene Version von unserer erwarteten abweicht — nicht
  // nur, wenn sie größer ist. Bei exakter Versionsgleichheit (zwei Clients
  // committen "gleichzeitig" denselben Versionssprung) hat der Server einen
  // von beiden abgelehnt; wird das nicht erkannt, glaubt der abgelehnte
  // Client fälschlich, sein lokaler State (z.B. ein gespielter Stich) sei
  // gespeichert, obwohl der Server ihn nie erhalten hat. Genau das führte zu
  // dem gemeldeten Bug: ein Kartenzug "verschwand" und die Zugreihenfolge
  // sprang auf einen älteren Spieler zurück.
  async function commit(nextRoom) {
    const withVer = {...nextRoom, version:(roomRef.current?.version??0)+1, updatedAt:Date.now()};
    roomRef.current = withVer; setRoom(withVer);
    const server = await writeRoom(withVer);
    setConnState(server ? "ok" : "err");
    if (!server) return { accepted:false, room:null };
    if (server.version !== withVer.version) {
      // Abgelehnt: der Server hatte bereits einen anderen Schreibzugriff mit
      // derselben oder einer höheren Version übernommen. Wir müssen seinen
      // autoritativen Stand übernehmen, egal ob die Version größer, gleich
      // oder (durch einen Reset) sogar kleiner ausfällt.
      roomRef.current = server; setRoom(server);
      return { accepted:false, room:server };
    }
    return { accepted:true, room:withVer };
  }

  useEffect(() => {
    const id = setInterval(async () => {
      const remote = await readRoom(initialRoom.code);
      if (!remote) { setConnState("err"); return; }
      setConnState("ok");
      if (remote.version > (roomRef.current?.version ?? -1)) {
        roomRef.current = remote;
        setRoom(remote);
      }
      const r = roomRef.current;
      if (r && r.host !== mySeat) {
        const stale = Date.now() - r.updatedAt > HOST_TIMEOUT_MS;
        const humanSeats = SEATS.filter(s => r.players[s] && !r.players[s].bot);
        const seniorSeat = humanSeats[0];
        if (stale && seniorSeat === mySeat && r.gs) {
          const gsWithLog = {...r.gs, log:[...r.gs.log, `${myName} übernimmt Host-Aufgaben (Verbindung zu ${r.players[r.host]?.name || "Host"} verloren).`]};
          commit({...r, host: mySeat, gs: gsWithLog});
        }
      }
    }, POLL_MS);
    return () => clearInterval(id);
  }, [initialRoom.code, mySeat]);

  useEffect(() => {
    if (!isHost) return;
    const id = setInterval(() => {
      const r = roomRef.current;
      if (!r) return;
      if (Date.now() - r.updatedAt < HOST_HEARTBEAT_MS) return;
      commit({...r});
    }, HOST_HEARTBEAT_MS);
    return () => clearInterval(id);
  }, [isHost]);

  async function dispatch(action, attemptsLeft = 3) {
    const r = roomRef.current;
    if (!r?.gs) return;
    if (action.type === "nextHand" && r.host !== mySeat) return;
    if (action.type === "acknowledgeEvent") return;
    const next = applyGameAction(r.gs, mySeat, action);
    if (next === r.gs) return;
    const result = await commit({...r, gs: next});
    if (!result.accepted && attemptsLeft > 0) {
      // Unser Schreibzugriff wurde verworfen, weil ein anderer Client (Host-
      // Bot-Timer, Trick-Abschluss, gegnerischer Spielzug, ...) zwischenzeitlich
      // committet hat. roomRef.current zeigt jetzt bereits auf den echten
      // Serverstand (siehe commit()) – wir wenden die Aktion des Spielers
      // einfach erneut darauf an, statt sie verloren gehen zu lassen.
      dispatch(action, attemptsLeft - 1);
    }
  }

  // ── HOST-AUFGABEN ──
  useEffect(() => {
    if (!isHost || !gs || gs.phase !== "trumpSelect") return;
    if (!room.players[gs.declarer]?.bot) return;
    const t = setTimeout(() => {
      const r = roomRef.current;
      const g = r?.gs;
      if (!g || g.phase !== "trumpSelect" || !r.players[g.declarer]?.bot) return;
      commit({...r, gs: applySelectTrump(g, botChooseTrump(g.hands[g.declarer]||[]))});
    }, 1100);
    return () => clearTimeout(t);
  }, [isHost, gs?.phase, gs?.declarer, gs?.handNumber]);

  useEffect(() => {
    if (!isHost || !gs || gs.phase !== "playing" || gs.trickComplete || !gs.currentTurn) return;
    const seat = gs.currentTurn;
    if (!room.players[seat]?.bot) return;
    const t = setTimeout(() => {
      const r = roomRef.current;
      const g = r?.gs;
      if (!g || g.currentTurn !== seat || g.trickComplete) return;
      commit({...r, gs: botTakeTurn(g)});
    }, 900 + Math.random()*500);
    return () => clearTimeout(t);
  }, [isHost, gs?.currentTurn, gs?.phase, gs?.trickComplete, gs?.trickNumber]);

  useEffect(() => {
    if (!isHost || !gs?.trickComplete) return;
    const delay = gs.pendingEvent ? 3400 : 1300;
    const t = setTimeout(() => {
      const r = roomRef.current;
      if (r?.gs?.trickComplete) commit({...r, gs: applyClearTrick(r.gs)});
    }, delay);
    return () => clearTimeout(t);
  }, [isHost, gs?.trickComplete, gs?.trickNumber, gs?.pendingEvent]);

  if (!gs) {
    return (
      <ScreenShell>
        <TitleBadge subtitle="VERBINDE …"/>
        <p style={{fontSize:14,opacity:0.5}}>Warte auf Spieldaten …</p>
        <button onClick={onLeave} style={{marginTop:20,fontSize:13,padding:"10px 16px",borderRadius:PXR,background:COLORS.panelDark,color:COLORS.cream,border:`2px solid #3a2f60`,cursor:"pointer",fontFamily:PIXEL_FONT}}>← VERLASSEN</button>
      </ScreenShell>
    );
  }

  return <GameView
    gameState={gs}
    mySeat={mySeat}
    myHand={gs.hands[mySeat]}
    onAction={dispatch}
    canAdvanceHand={isHost}
    hostName={room.players[room.host]?.name}
    botSeats={botSeats}
    roomCode={room.code}
    connState={connState}
    onNewGame={()=>{
      if (!isHost) return;
      const r = roomRef.current;
      const names = gs.names;
      const declarer = SEATS[Math.floor(Math.random()*4)];
      commit({...r, gs: dealNewGame(names, 1, 0, 0, declarer, ["Neues Spiel."], declarer)});
    }}
  />;
}

function OnlineMode({ onBack }) {
  const [stage, setStage] = useState("entry");
  const [roomData, setRoomData] = useState(null);
  const [isCreator, setIsCreator] = useState(false);
  const [seatInfo, setSeatInfo] = useState(null);

  if (stage === "entry") {
    return <OnlineEntryScreen
      onBack={onBack}
      onRoomReady={(room, creator)=>{ setRoomData(room); setIsCreator(creator); setStage("lobby"); }}
    />;
  }
  if (stage === "lobby" && roomData) {
    return <OnlineLobby
      initialRoom={roomData}
      isCreator={isCreator}
      onBack={()=>{ setStage("entry"); setRoomData(null); }}
      onEnterGame={(room, mySeat, myName)=>{ setSeatInfo({room, mySeat, myName}); setStage("game"); }}
    />;
  }
  if (stage === "game" && seatInfo) {
    return <OnlineGame
      initialRoom={seatInfo.room}
      mySeat={seatInfo.mySeat}
      myName={seatInfo.myName}
      onLeave={()=>{ setStage("entry"); setRoomData(null); setSeatInfo(null); }}
    />;
  }
  return null;
}

function YamaGame() {
  const [mode, setMode] = useState(null);
  const [playerName, setPlayerName] = useState(null);

  if (mode === null) {
    return (
      <ScreenShell>
        <TitleBadge subtitle="4 SPIELER · 2 TEAMS"/>
        <div style={{width:"100%",maxWidth:320,display:"flex",flexDirection:"column",gap:12}}>
          <BigButton onClick={()=>setMode("online")}>
            <Users size={18}/> MIT FREUNDEN (ONLINE)
          </BigButton>
          <BigButton onClick={()=>setMode("cpu-persona")} color={COLORS.neonBlue}>
            <Cpu size={18}/> GEGEN CPU
          </BigButton>
        </div>
        <p style={{fontSize:12,opacity:0.35,marginTop:22,textAlign:"center",lineHeight:1.7,maxWidth:300}}>
          Online: Raum erstellen, 4-stelligen Code teilen,<br/>Freunde öffnen dieselbe Adresse und treten bei.
        </p>
      </ScreenShell>
    );
  }
  if (mode === "cpu-persona") {
    return <PersonaSelectScreen
      onSelect={(name)=>{ setPlayerName(name); setMode("cpu"); }}
      onBack={()=>setMode(null)}
    />;
  }
  if (mode === "cpu" && playerName) {
    return <CPUMode playerName={playerName}/>;
  }
  if (mode === "online") {
    return <OnlineMode onBack={()=>setMode(null)}/>;
  }
  return null;
}
